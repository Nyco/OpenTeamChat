<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>OpenTeamChat</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>

  <button id="theme-toggle" aria-label="Toggle light/dark theme" title="Toggle light/dark theme">
    <svg class="icon-moon" width="16" height="16" viewBox="0 0 16 16" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
      <path d="M13.5 9.5A6 6 0 0 1 6.5 2.5a6 6 0 1 0 7 7z" fill="currentColor"/>
    </svg>
    <svg class="icon-sun" width="16" height="16" viewBox="0 0 16 16" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
      <circle cx="8" cy="8" r="2.5" fill="currentColor"/>
      <line x1="8" y1="1.5" x2="8" y2="3.5" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
      <line x1="8" y1="12.5" x2="8" y2="14.5" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
      <line x1="1.5" y1="8" x2="3.5" y2="8" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
      <line x1="12.5" y1="8" x2="14.5" y2="8" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
      <line x1="3.4" y1="3.4" x2="4.8" y2="4.8" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
      <line x1="11.2" y1="11.2" x2="12.6" y2="12.6" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
      <line x1="12.6" y1="3.4" x2="11.2" y2="4.8" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
      <line x1="4.8" y1="11.2" x2="3.4" y2="12.6" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
    </svg>
  </button>

  <div class="login-wrapper">
    <div class="login-card">

      <div class="login-logo">
        <img src="OpenTeamChat.png" alt="OpenTeamChat logo" />
        <h1>OpenTeamChat</h1>
      </div>

      <div class="jid-preview" id="jid-preview" aria-live="polite"></div>

      <form id="login-form" novalidate>

        <div class="field-group">
          <label for="login-username">Login</label>
          <input
            type="text"
            id="login-username"
            name="username"
            autocomplete="username"
            placeholder="alice"
            spellcheck="false"
            autocapitalize="none"
            autocorrect="off"
          />
        </div>

        <div class="field-group">
          <label for="login-server">Server</label>
          <input
            type="text"
            id="login-server"
            name="server"
            autocomplete="url"
            placeholder="example.org"
            spellcheck="false"
            autocapitalize="none"
            autocorrect="off"
          />
        </div>

        <div class="field-group">
          <label for="login-password">Password</label>
          <div class="password-wrapper">
            <input
              type="password"
              id="login-password"
              name="password"
              autocomplete="current-password"
              placeholder="••••••••"
            />
            <button type="button" id="password-toggle" aria-label="Show password" title="Show password">
              <svg class="icon-eye" width="16" height="16" viewBox="0 0 16 16" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
                <path d="M1 8s2.5-5 7-5 7 5 7 5-2.5 5-7 5-7-5-7-5z" stroke="currentColor" stroke-width="1.4" stroke-linejoin="round"/>
                <circle cx="8" cy="8" r="2" stroke="currentColor" stroke-width="1.4"/>
              </svg>
              <svg class="icon-eye-off" width="16" height="16" viewBox="0 0 16 16" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
                <path d="M1 8s2.5-5 7-5 7 5 7 5-2.5 5-7 5-7-5-7-5z" stroke="currentColor" stroke-width="1.4" stroke-linejoin="round"/>
                <circle cx="8" cy="8" r="2" stroke="currentColor" stroke-width="1.4"/>
                <line x1="2" y1="2" x2="14" y2="14" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/>
              </svg>
            </button>
          </div>
        </div>

        <div class="status-message" id="status-message" role="alert"></div>

        <button type="submit" id="login-button">Log in</button>

      </form>

    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/strophe.js@1.6.2/src/strophe.js"></script>
  <script src="js/login.js"></script>

</body>
</html>
